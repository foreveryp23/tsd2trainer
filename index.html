/* v2.1.46 音乐预加载进度界面 */
/* v2.1.55：预载界面套 fc.css（黑底白框 + 橙条 + CJK 字体），与游戏内窗口风格统一 */
#sc-preload{background:#000}
#sc-preload.on{display:flex;align-items:center;justify-content:center}
#sc-preload .preload-box{width:78%;max-width:420px;text-align:center;color:var(--c-white);font-family:var(--font-cjk);background:#000;border:2px solid var(--c-white);padding:14px 16px}
#sc-preload .preload-title{font-size:20px;font-weight:700;letter-spacing:2px;margin-bottom:8px;color:var(--c-white)}
#sc-preload .preload-sub{font-size:12px;color:var(--c-white);opacity:.6;margin-bottom:18px;line-height:1.6}
#sc-preload .preload-bar{width:100%;height:16px;background:#000;border:2px solid var(--c-white);border-radius:8px;overflow:hidden}
#sc-preload .preload-fill{height:100%;width:0;background:var(--c-orange);transition:width .18s ease}
#sc-preload .preload-status{margin-top:10px;font-size:12px;color:var(--c-white);opacity:.7}
</style></head>

<div id="cabinet">

      </section>

      <section class="scene" id="sc-title">

        <div class="t-ver">v2.0.1</div>

      <!-- ============ 选将 ============ -->

          <div class="roster-body" id="roster"></div>

        </div>
        <div class="win w-detail" id="detail"></div>

        </div>

          <div class="mi" data-act="formation">阵形</div>
          <div class="mi" data-act="scout">侦察</div>
          <div class="mi" data-act="stage">出阵</div>
          <div class="mi" data-act="equip">装备</div>
          <div class="mi" data-act="back">返回</div>
        </div>
      </section>

      <!-- ============ 战斗 ============ -->
      <section class="scene" id="sc-battle">
        <div class="bt-field" id="bt-field">
          <!-- FC 原版布局：上方 2/3（0~160px）给敌我阵营，下方 1/3（163~237px）给指令区。
               我方在左（立绘 scaleX(-1) 转身朝右），敌方在右（立绘原朝左）。
               每侧 5 槽，槽内含横排姓名、兵力数字、立绘、粗血条；
               兵力数字与血条共用同一条视觉中线（见 fc.css 的 .sol / .hpbar）。
               血条长度按本阵营 5 人兵力上限比例决定，最长不超过最前站位。 -->
          <div class="bt-line ally" id="bt-allies"></div>
          <div class="bt-line enemy" id="bt-enemies"></div>
        </div>
        <!-- 总攻提示条已废弃：总攻状态改由「双方全员前压成一字」这一画面语言表达，
             不再占用屏幕空间。元素保留仅为兼容旧调用，CSS 里恒为 display:none。 -->
        <div id="bt-autoflag" class="hidden"></div>
        <!-- 下方指令区。右侧同一矩形里叠了三层框，从下到上：
               w-msg 战况（常驻底层） → w-cmd 指令框 → w-sub 谋略/部将二级菜单。
             默认露出的是战况；轮到下令时指令框自动盖上来，按 B 收起、按 A 再唤出。
             左侧 52px 窄列：上为发令武将头像（顶对齐指令框），下为「某某的指令」（底对齐指令框）。 -->
        <div class="bt-actor-face hidden" id="bt-actor-face"></div>
        <div class="win w-msg" id="bt-msg"><div class="msg-inner" id="msg-inner"></div></div>
        <div class="win w-cmd hidden" id="bt-cmd"></div>
        <div class="win w-sub hidden" id="bt-sub"></div>
        <div class="bt-actor hidden" id="bt-actor"></div>
      </section>

      <!-- 部将全屏武将信息面板：从战斗场景移出，做成与场景无关的顶层浮层，

<script>
/* 旧 WebView（Android 5.x 等）兼容补丁：Array.prototype.includes / String.prototype.includes。 */
if (!Array.prototype.includes) {
  Array.prototype.includes = function(v, f) {
    if (f === undefined) f = 0;
    return this.indexOf(v, f) !== -1;
  };
}
if (!String.prototype.includes) {
  String.prototype.includes = function(v, f) {
    if (f === undefined) f = 0;
    return this.indexOf(v, f) !== -1;
  };
}
</script>
